name: Windows build

# A Windows installer for trying a change, without making a release.
# Run it with `gh workflow run windows-build.yml` and grab the artifact.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-build
      - run: npm ci
      - run: npx tauri build --bundles nsis
        env:
          VEGA_MSA_CLIENT_ID: ${{ secrets.VEGA_MSA_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: vega-windows
          path: target/release/bundle/nsis/*.exe
          retention-days: 7
