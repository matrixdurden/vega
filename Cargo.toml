[workspace]
resolver = "3"
members = ["crates/vega-core", "src-tauri"]
default-members = ["crates/vega-core"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/matrixdurden/vega"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
